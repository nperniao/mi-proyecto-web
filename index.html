<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Proyecto Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Bienvenido/a a mi sitio web</h1>

        <nav>
            <a href="#inicio">Inicio</a> |
            <a href="#informacion">Información</a> |
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <main>
        <section id="inicio">
            <h2>Inicio</h2>
            <p>Este es un proyecto para aprender Git y GitHub.</p>
        </section>

        <section id="informacion">
            <h2>Información</h2>
            <p>Esta página ha sido creada utilizando únicamente HTML.</p>
        </section>

        <section id="contacto">
    <h2>Contacto</h2>

    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" autocomplete="name" required minlength="2" maxlength="80">

        <br><br>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" autocomplete="email" required>

        <br><br>

        <label for="mensaje">Mensaje:</label>
        <br>
        <textarea id="mensaje" name="mensaje" rows="5" maxlength="500" required></textarea>

        <p class="form-meta"><span id="contador">0</span>/500 caracteres</p>

        <br><br>

        <button type="submit">Enviar</button>
    </form>
    <p id="estado-formulario" class="form-status" role="status" aria-live="polite"></p>
</section>
    </main>

<script src="app.js" defer></script>
</body>
</html>
